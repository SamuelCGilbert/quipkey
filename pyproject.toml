[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hotmic"
dynamic = ["version"]
description = "Press a hotkey, speak, and the text is typed into any app. Local speech recognition (NVIDIA Parakeet via onnx-asr)."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Samuel C. Gilbert" }]
keywords = ["dictation", "speech-to-text", "push-to-talk", "parakeet", "voice-typing", "wayland"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "onnx-asr[hub]>=0.12",
    "numpy",
    "sounddevice>=0.5",
    # Windows builds ship DirectML (any DirectX 12 GPU) plus the CPU provider.
    "onnxruntime-directml>=1.20; sys_platform == 'win32'",
    "onnxruntime>=1.20; sys_platform != 'win32'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyinstaller>=6.10", "pillow"]

[project.urls]
Homepage = "https://github.com/SamuelCGilbert/hotmic"
Issues = "https://github.com/SamuelCGilbert/hotmic/issues"

[project.scripts]
hotmic = "hotmic.cli:main"

[tool.hatch.version]
path = "src/hotmic/meta.py"
pattern = 'VERSION = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/hotmic"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
