# Contributors sign the CLA (CLA.md) once, by commenting on their first pull request.
# Signatures are stored in the "cla-signatures" branch of this repository.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && (
        github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: SamuelCGilbert,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your pull request! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by commenting with the sentence below. You only need to do this once.
